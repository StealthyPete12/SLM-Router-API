# Prometheus scrapes the router API's /metrics over the Compose network.
# Check the target at http://localhost:9090/targets (state should be UP).

global:
  scrape_interval: 10s       # short, so a demo burst shows up within seconds
  evaluation_interval: 10s

scrape_configs:
  - job_name: slm-router-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
